# ponygo 自测门禁：tests/run.sh 是唯一回归入口，按平台 × 分层看守
#   - ubuntu：全量（full 层，94 场景）
#   - windows-latest：Git Bash，PR 只跑 core 层（26 场景）；夜间/手动才跑全量
# 聚合门 all-checks-passed 是分支保护唯一依赖（名字不可改）。
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # 夜间全量（GitHub Actions 的 cron 一律按 UTC 解释；18:00 UTC = 北京时间次日 02:00，
  # 避开 PR 高峰时段；只有此事件会让 windows-full 真正执行）
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  selftest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 配置本地治理钩子路径（git config 不入库）
        run: git config core.hooksPath .githooks
      - name: 安装测试 YAML 依赖（PyYAML）
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: bash tests/run.sh
        run: bash tests/run.sh

  # PR 必跑：Windows 只跑 core 层（PONYGO_TEST_LAYER=core → 26 场景）。
  # 预算依据：CORE-26（s90 已移出）在 Windows 实测推算 ≈37.6m → 60min 留约 22m 余量（见下方 timeout 注释）。
  windows-core:
    runs-on: windows-latest
    # B026（2026-11-22 裁决 ③）：s90（gate-hardening 折叠，gh1–gh14）已移出 CORE → NONCORE，
    # 94 场景字面不变（Linux full 层照跑，keeper 面不减）；Windows CORE-26 = 总 62m17s − s90 24.7m ≈ 37.6m，
    # → 60m 留约 22m 余量。补偿判据：gh6 断言「s90 ∈ NONCORE-SET 且本预算 == 60」，防 s90 被塞回 CORE 又把预算撑爆。
    # 决策、量化依据与落选方案见 .agents/notes/ 下 B026 决策记录 + .dev-team/plan-wave15.md §6.1
    timeout-minutes: 60
    env:
      PONYGO_TEST_LAYER: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 配置本地治理钩子路径（git config 不入库）
        shell: bash
        run: git config core.hooksPath .githooks
      - name: 安装测试 YAML 依赖（PyYAML）
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: bash tests/run.sh（core 层，Git Bash）
        shell: bash
        run: bash tests/run.sh

  # 夜间/手动全量：不设 PONYGO_TEST_LAYER（未设 = full，94 场景）。
  # 只在 schedule 与 workflow_dispatch 触发；预算依据：历史观测 ≈91.7min（曾 167min 才被人工取消）。
  windows-full:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # 单场景看门狗（tests/run.sh 的 PONYGO_SCN_TIMEOUT，合法 1..86400 秒）。
      # 为什么需要（2026-11-23 run 45042996846）：90/94 场景 2h47m 跑完后，s91_deferred_acceptance
      # 单场景 >73min 未返回，整卷到 240min 上限被平台 cancelled ——「cancelled」既无归因也不是 RED。
      # 语义（tests/run.sh scn_begin）：超时打 `TIMEOUT <id>（超 Ns）` 到 stderr 后 **TERM 整轮**。
      # 阈值取 45min（2700s）的依据 = Windows 实测单场景上界 + 余量：
      #   s89_auditfix 2030s（run 45042996846）、s90_gate_hardening 1746s、s88 368s；
      #   30min（1800s）已于 run 45103476794 实测误杀 s89（133m 处 TIMEOUT s89）——阈值必须高于
      #   真实上界，否则看门狗自己变成红源。45min 下最迟 ~3h35m 结束（< 240min 上限），
      #   仍能把真正的挂死套件（如 s91）点名成 RED 而不是整卷 cancelled。
      # 只钉 full 卷，不动 PR 级 core（26 场景 26m17s）的预算。
      PONYGO_SCN_TIMEOUT: 2700
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: 配置本地治理钩子路径（git config 不入库）
        shell: bash
        run: git config core.hooksPath .githooks
      - name: 安装测试 YAML 依赖（PyYAML）
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: bash tests/run.sh（full 层，Git Bash）
        id: full_run
        shell: bash
        # tee 落盘是后置判词步的输入：没有它，失败时只能翻几万行 job log 人肉找判词。
        # pipefail 保证 tee 不吞掉测试退出码（bash -e 单独用不够）。
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/full.log"
      - name: 判词与证据归档（full 卷，恒跑）
        if: always()
        shell: bash
        # 为什么恒跑：取证的价值在**失败**时最大（2026-11-23 连续三次红都靠翻日志定位）。
        # 判词同时进 step summary（人一眼看）与 job log（gh run view 可取，作为 B005 判据 4 的可复跑收据）。
        run: |
          LOG="$RUNNER_TEMP/full.log"
          {
            echo "## windows-full 判词（${GITHUB_SHA:0:7}）"
            echo ""
            echo "- 测试步结果: ${{ steps.full_run.outcome }}"
            echo "- 场景结果: $(grep -aoE '==== 测试结果：.*' "$LOG" 2>/dev/null | tail -1)"
            echo "- 总体判定: $(grep -aoE '==== 结果：.*' "$LOG" 2>/dev/null | tail -1)"
            echo ""
            echo '```'
            grep -aE 'TIMEOUT s|RED  s[0-9]' "$LOG" 2>/dev/null | tail -20 || echo '(无 TIMEOUT / RED)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE 'TIMEOUT s|RED  s[0-9]|==== (测试结果|结果)：' "$LOG" 2>/dev/null | tail -20 || true

  # 治理执行面与自测同属本 workflow，聚合门可直接消费其结果；实例门（hygiene / backlog）只在本仓执行。
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash .meta/gates/ci-verify.sh
      - run: bash .meta/gates/scratch-hygiene.sh && bash .meta/gates/scratch-hygiene.spec.sh
      # backlog v3 门：门本体与负样本自检各占一个独立 step（任一步红都不被 && 短路成笼统失败）
      - run: bash .meta/gates/backlog-gate.sh
      - run: bash .meta/gates/backlog-gate.spec.sh
      - run: bash tests/acceptance/observe-b027/run-all.sh
      - run: |
          git config core.hooksPath .githooks
          bash ponygo audit --run-specs

  # 聚合门：分支保护只依赖这一个检查（名字不变）。
  #   required 三元组 = selftest-linux + windows-core + governance，必须**恰为** success success success
  #     （skipped/failure/cancelled 一律判失败——skipped 不得冒充通过）；
  #   windows-full 只在 schedule/workflow_dispatch 跑 → 其他事件允许 skipped；
  #     **事件感知**：schedule（夜间全量）下 skipped 必须失败，failure/cancelled 任何事件都失败。
  all-checks-passed:
    if: always()
    needs: [selftest-linux, windows-core, windows-full, governance]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          set -e
          result="${{ needs.selftest-linux.result }} ${{ needs.windows-core.result }} ${{ needs.governance.result }}"
          full="${{ needs.windows-full.result }}"
          event="${{ github.event_name }}"
          echo "event: $event"
          echo "job results: $result（windows-full: $full）"
          [ "$result" = "success success success" ]
          case "$full" in
            success) ;;
            skipped)
              if [ "$event" = "schedule" ]; then
                echo "FAIL windows-full 在 schedule（夜间全量）下不得 skipped——聚合门判失败" >&2
                exit 1
              fi
              ;;
            *)
              echo "FAIL windows-full 结果非 success/skipped（实得 $full）——failure/cancelled 一律判失败" >&2
              exit 1
              ;;
          esac
          echo "all required checks passed"

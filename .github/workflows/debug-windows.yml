name: debug-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Diagnose gates
        shell: bash
        run: |
          set -x
          git config core.hooksPath .githooks
          for s in .meta/gates/*.spec.sh; do
            echo "===== $s ====="
            bash "$s"; echo "SPEC_EXIT=$?"
          done
          command -v python3 || true
          python3 --version || true
          python3 -c 'import yaml; print("PYYAML_OK")' || true
          T=$(mktemp -d)
          cd "$T"
          git init -q
          bash "$GITHUB_WORKSPACE/ponygo" init >/dev/null
          printf 'level: 1\n' > .meta/meta.yaml
          mkdir -p .agents/notes/implemented/feature
          cat > .agents/notes/implemented/feature/2026-01-02-gate.md <<'ADREOF'
          # Agent Note: gate fixture

          Status: implemented

          ## Problem

          fixture.

          ## Decision

          fixture.

          ## Alternatives considered

          - none.
          ADREOF
          printf '#!/usr/bin/env bash\nexit 0\n' > .meta/gates/x.spec.sh
          echo "===== audit --run-specs ====="
          bash "$GITHUB_WORKSPACE/ponygo" audit --level M --run-specs 2>&1
          echo "AUDIT_EXIT=$?"

name: debug-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Diagnose exact scenario27
        shell: bash
        run: |
          set -x
          python3 -m pip install --disable-pip-version-check pyyaml || true
          T=$(mktemp -d)
          cd "$T"
          git init -q
          bash "$GITHUB_WORKSPACE/ponygo" init >/dev/null
          printf 'level: 1\n' > .meta/meta.yaml
          mkdir -p .agents/notes/implemented/feature
          cat > .agents/notes/implemented/feature/2026-01-02-gate.md <<'ADREOF'
          # Agent Note: gate fixture

          Status: implemented

          ## Problem

          fixture.

          ## Decision

          fixture.

          ## Alternatives considered

          - none.
          ADREOF
          printf '#!/usr/bin/env bash\ntouch "$(cd "$(dirname "$0")" && pwd)/WITNESS.txt"\necho "[x.spec] 合规样本：断言已跑"\nexit 0\n' > .meta/gates/x.spec.sh
          echo "===== generated A2 ====="
          bash .meta/gates/adr-verify.spec.sh; echo "A2_RC=$?"
          echo "===== x.spec ====="
          bash .meta/gates/x.spec.sh; echo "X_RC=$?"
          echo "===== audit ====="
          bash "$GITHUB_WORKSPACE/ponygo" audit --level M --run-specs 2>&1; echo "AUDIT_RC=$?"

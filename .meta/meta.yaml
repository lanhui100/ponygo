# ============================================================
# ponygo 治理根状态文件 —— 唯一内容字段是 level
# ============================================================
#
# 铁律（防手填漂移，呼应 methodology.md P2「凡机械可查必有非零退出命令」）：
#   - 本文件【只】承载一个真值源字段：level（成熟度级）。
#   - 版本号 → 由 git 派生（git log / tag），不要在这里手填第二个"版本"。
#   - "已激活组件"清单 → 由 .meta/ 下【目录是否实际存在】充当（文件夹即标签），
#     不要在这里手填一份会与目录漂移的副本。
#   - "演进记录" → 由 git 历史 + decisions/ 下的 ADR 充当，不要在这里重复记。
#   - 合法键 = level + ai-surface 两个：ai-surface: on|off 控制 sync 是否生成 AI 投影；
#     出现其它键（含缩进的 level/ai-surface）会被 'ponygo status' / 'ponygo audit' 告警（WARN）。
#
# 为什么只留一个字段：多字段（版本/组件/演进/成熟度）会互相派生、手填必漂移，
# 重演 methodology.md §2.1 用「文件夹即标签」消灭掉的「行与文件夹不一致」。

# 成熟度级（唯一真值源，取值 = 0-6 的整数，唯一合法形态；勿写 "L0" 字符串）：
#   L0 播种      —— 治理根刚建立，尚无决策可记
#   L1 决策入册   —— decisions/ 有记录、路径编码 lifecycle×class、含 Alternatives
#   L2 承诺可验   —— 有非零退出门禁 + 负样本 spec（本地钩子）
#   L3 文档分层   —— tier 分类 + slop checklist + 词数预算   [目标画像，靠 review]
#   L4 流程资产   —— 高频流程资产化为 skills（触发式 description + 校准样例） [靠 review]
#   L5 负空间     —— 归档冻结 + 简化审计 + 依赖政策          [靠 review]
#   L6 领域定制   —— 运行时不变量 / 类型约束等专属约定        [靠 review]
#
# 首版止步 L2 的可机械判定；L3-L6 是"目标画像"，判据靠 review（P6 诚实条款）。

level: 0
